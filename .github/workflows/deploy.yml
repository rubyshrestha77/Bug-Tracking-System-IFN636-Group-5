name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: instance-1
            host: ${{ secrets.EC2_HOST_1 }}
            key: ${{ secrets.EC2_SSH_KEY_1 }}
          - name: instance-2
            host: ${{ secrets.EC2_HOST_2 }}
            key: ${{ secrets.EC2_SSH_KEY_2 }}

    name: Deploy to ${{ matrix.name }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ matrix.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ matrix.key }}
          script: |
            cd ${{ secrets.EC2_PATH }}
            git pull origin main
            npm run install-all
            npm run build --prefix frontend
            pm2 reload ecosystem.config.js --update-env
            pm2 save