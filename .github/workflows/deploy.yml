name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance: [ 1, 2 ]

    name: Deploy to instance-${{ matrix.instance }}

    steps:
      - name: Check secrets
        run: |
          echo "host: $H"
          echo "user: $U"
          echo "path: $P"
          echo "key length: ${#K}"
          echo "key starts: ${K:0:30}"
        env:
          H: ${{ secrets[format('EC2_HOST_{0}', matrix.instance)] }}
          K: ${{ secrets[format('EC2_SSH_KEY_{0}', matrix.instance)] }}
          U: ${{ secrets.EC2_USER }}
          P: ${{ secrets.EC2_PATH }}

      - name: Test SSH connectivity
        run: nc -zv -w 10 $H 22
        env:
          H: ${{ secrets[format('EC2_HOST_{0}', matrix.instance)] }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[format('EC2_HOST_{0}', matrix.instance)] }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets[format('EC2_SSH_KEY_{0}', matrix.instance)] }}
          script: |
            cd ${{ secrets.EC2_PATH }}
            git pull origin main
            npm run install-all
            npm run build --prefix frontend
            pm2 reload ecosystem.config.js --update-env
            pm2 save