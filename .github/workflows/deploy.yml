name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ${{ matrix.instance }}
    strategy:
      fail-fast: false
      matrix:
        instance: [ instance-1, instance-2 ]

    name: Deploy to ${{ matrix.instance }}

    env:
      APP_DIR: /home/ubuntu/Bug-Tracking-System-IFN636-Group-5

    steps:
      - name: Pull latest code
        run: |
          cd $APP_DIR
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd $APP_DIR
          npm run install-all

      - name: Build frontend
        run: |
          cd $APP_DIR
          npm run build --prefix frontend

      - name: Reload application
        run: |
          cd $APP_DIR
          pm2 reload ecosystem.config.js --update-env
          pm2 save

      - name: Verify health
        run: |
          sleep 5
          curl -f http://localhost:5001/api/health